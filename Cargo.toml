[package]
name = "rucycle"
version = "0.1.0"
edition = "2021"
description = "A fast TUI for finding Rust projects and cleaning their Cargo build artifacts."
authors = ["BackRunner <dev@backrunner.top>"]
license = "MIT"
repository = "https://github.com/backrunner/rucycle"
readme = "README.md"
keywords = ["cargo", "clean", "tui", "rust", "disk"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
rayon = "1.12.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
