[package]
name = "rucycle"
version = "0.1.0"
edition = "2021"
description = "A fast TUI for finding Rust projects and cleaning their Cargo build artifacts."
authors = ["BackRunner <dev@backrunner.top>"]
license = "MIT"
repository = "https://github.com/BackRunner/rucycle"
readme = "README.md"
keywords = ["cargo", "clean", "tui", "rust", "disk"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
rayon = "1.10"
ratatui = "0.29"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
