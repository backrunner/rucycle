name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: rucycle-linux-x64
            asset: rucycle-linux-x64
            exe: rucycle
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: rucycle-linux-arm64
            asset: rucycle-linux-arm64
            exe: rucycle
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: rucycle-darwin-x64
            asset: rucycle-darwin-x64
            exe: rucycle
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: rucycle-darwin-arm64
            asset: rucycle-darwin-arm64
            exe: rucycle
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: rucycle-win32-x64
            asset: rucycle-win32-x64.exe
            exe: rucycle.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify npm-installed binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf npm/bin
          node npm/install.js --from-local "target/${{ matrix.target }}/release"
          node npm/rucycle.js --version
      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets dist/bundles/${{ matrix.archive }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/bundles/${{ matrix.archive }}/
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/assets/${{ matrix.asset }}
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod 755 dist/assets/${{ matrix.asset }}
          fi
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist/bundles
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../assets/${{ matrix.archive }}.zip" "${{ matrix.archive }}"
          else
            tar -czf "../assets/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/assets/${{ matrix.asset }}
            dist/assets/${{ matrix.archive }}.tar.gz
            dist/assets/${{ matrix.archive }}.zip
          if-no-files-found: ignore

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Sync package metadata
        id: package
        run: node scripts/sync-npm-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${{ steps.package.outputs.prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}" \
            $(find dist -type f \( -name 'rucycle-*' -o -name '*.tar.gz' -o -name '*.zip' \))
      - name: Checkout Homebrew tap
        if: steps.package.outputs.prerelease == 'false' && env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: BackRunner/homebrew-rucycle
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew tap formula
        if: steps.package.outputs.prerelease == 'false' && env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          node scripts/update-homebrew-formula.mjs \
            --version "${{ steps.package.outputs.version }}" \
            --asset-dir dist \
            --tap-root homebrew-tap
      - name: Publish Homebrew tap formula
        if: steps.package.outputs.prerelease == 'false' && env.HOMEBREW_TAP_TOKEN != ''
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain -- Formula/rucycle.rb)" ]]; then
            echo "Homebrew formula is already up to date"
            exit 0
          fi
          git add Formula/rucycle.rb
          git commit -m "Update rucycle to ${{ steps.package.outputs.version }}"
          git push
      - name: Publish npm package
        run: npm publish --access public --tag "${{ steps.package.outputs.npm_tag }}"
